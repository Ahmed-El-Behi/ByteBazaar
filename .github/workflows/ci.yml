name: CI

on:
  push:
    branches: [main, chore/**, feat/**, fix/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend (lint, types, tests unitaires)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm test

  frontend:
    name: Frontend (types, traductions, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-i18n.mjs
      - run: npm run format:check
      - run: npx ng test --watch=false
      - run: npm run build

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bytebazaar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base jetable du job : aucune donnée réelle
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebazaar?schema=public
      JWT_SECRET: ci-uniquement-pas-un-vrai-secret
      # Aucun serveur SMTP : les e-mails échouent, sont journalisés et n'interrompent rien
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      FRONTEND_URL: http://localhost:4300
      PORT: 3000
      E2E_ADMIN_EMAIL: admin@e2e.bytebazaar.test
      E2E_ADMIN_PASSWORD: admin-e2e-ci-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: API — installation, base de données et données de démonstration
        working-directory: backend
        run: |
          npm ci
          npx prisma generate --config prisma7.config.ts
          npx prisma migrate deploy --config prisma7.config.ts
          npm run seed
          npm run seed:stock
          npm run seed:demo-orders
          npm run build

      - name: API — tests e2e Jest
        working-directory: backend
        run: npm run test:e2e

      - name: API — démarrage
        working-directory: backend
        run: |
          nohup node dist/main > ../api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:3000/health

      - name: Compte administrateur de test
        run: |
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E2E_ADMIN_EMAIL\",\"password\":\"$E2E_ADMIN_PASSWORD\",\"firstName\":\"Admin\",\"lastName\":\"CI\"}" \
            http://localhost:3000/auth/register > /dev/null
          PGPASSWORD=postgres psql -h localhost -U postgres -d bytebazaar \
            -c "update \"User\" set role = 'ADMIN' where email = '$E2E_ADMIN_EMAIL'"

      - name: Site — build de production et serveur
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup node scripts/serve.mjs > ../site.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4300/api/health

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Journaux de l'API et du site
        if: failure()
        run: tail -n 100 api.log site.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-playwright
          path: e2e/playwright-report/
          retention-days: 14
