<app-cursor />

<header class="topbar">
  <div class="container topbar-inner">
    <a routerLink="/" class="logo">
      <span class="logo-mark">BB</span>
      <span>Byte<b>Bazaar</b></span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
      <a routerLink="/produits" routerLinkActive="active">Catalogue</a>
      <span class="soon" title="Bientôt disponible">Configurateur</span>
    </nav>

    <form class="search" (submit)="search($event, q.value)">
      <input #q type="search" placeholder="Rechercher une référence…" />
    </form>

    <div class="user-actions">
      <button
        class="theme-switch"
        type="button"
        role="switch"
        [attr.aria-checked]="theme.theme() === 'dark'"
        aria-label="Mode sombre"
        [title]="theme.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"
        (click)="theme.toggle()"
      >
        <span class="slot">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </span>
        <span class="slot">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </span>
        <span class="knob"></span>
      </button>

      <a routerLink="/panier" class="cart-btn" title="Voir mon panier">
        🛒
        @if (cartState.itemCount() > 0) {
          <span class="cart-badge">{{ cartState.itemCount() }}</span>
        }
      </a>

      @if (auth.user(); as u) {
        <span class="user-name">Bonjour, <b>{{ u.firstName }}</b></span>
        <button
          class="logout"
          type="button"
          (click)="auth.logout(); cartState.clearLocal()"
          aria-label="Se déconnecter"
          title="Se déconnecter"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect class="room" x="7" y="3" width="10" height="18" stroke="none" />
            <path d="M5 21V4.5A1.5 1.5 0 0 1 6.5 3h11A1.5 1.5 0 0 1 19 4.5V21" />
            <path d="M3 21h18" />
            <g class="leaf">
              <rect x="7" y="3" width="10" height="18" />
              <circle cx="14.5" cy="12.5" r="0.9" fill="currentColor" stroke="none" />
            </g>
          </svg>
        </button>
      } @else {
        <a routerLink="/connexion" class="btn-sm">Connexion</a>
        <a routerLink="/inscription" class="btn-sm primary">Inscription</a>
      }
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <div class="container">
    <strong>ByteBazaar</strong> · Le bazar des composants PC en Tunisie · Prix en TND
  </div>
</footer>
